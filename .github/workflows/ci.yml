name: CI

on:
  pull_request:
    branches: [main]
  push:
    # Every branch, so a branch's result is ready by merge time (development
    # plan P1). Dependabot branches are skipped: their pull request runs CI.
    # `dist` holds the built front end that `ship.py` publishes; it is not
    # source to test.
    branches-ignore: [dist, "dependabot/**"]
  workflow_dispatch:

# A new push cancels the older run on the same branch. A run on `main` is never
# cancelled (and never replaced while queued): it gets a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks dir . --no-banner --redact

  server:
    name: Server — lint, type-check, test
    runs-on: ${{ matrix.os }}
    # bash on Windows too, for every step (W0.13). The runner's default pwsh
    # fails a step only on the exit code of its last native command: a block
    # with a failing command followed by a passing one is green. The agent's
    # Windows pytest step reported success with 2 failed tests under it.
    # bash -e -o pipefail stops at the first failing command.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Verify vendored platform integrity
        run: python scripts/check-vendored.py

      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy src/
      - name: Pytest
        run: pytest -n auto
      - name: Durable interaction acceptance detects broken guards
        run: python scripts/check-interactions-sabotage.py
      - name: MCP Apps acceptance detects broken guards
        run: python scripts/check-mcp-apps-sabotage.py
      - name: A2UI acceptance detects broken guards
        run: python scripts/check-a2ui-sabotage.py
      - name: AG-UI acceptance detects broken guards
        run: python scripts/check-agui-sabotage.py
      - name: Browser integration regressions detect broken guards
        run: python scripts/check-ui-backend-sabotage.py

  page:
    name: Page — type-check, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Interactive UI tests detect broken guards
        run: node ../scripts/check-ui-sabotage.mjs
      - run: npm run build
      # The page is copied from the website byte for byte (workbench.md §6).
      - name: Mascots are the website's own
        working-directory: .
        run: |
          git clone --depth 1 https://github.com/eugene-plexus/website /tmp/website
          cmp web/public/eugene-face.svg /tmp/website/public/eugene-face.svg
          for pose in welcome guide working curious; do
            cmp "web/public/mascots/eugene-$pose.svg" "/tmp/website/public/mascots/eugene-$pose.svg"
          done

  browsers:
    name: Rich content — ${{ matrix.browser }}
    runs-on: ubuntu-latest
    # Playwright's own image holds the browsers and every system library they
    # need, so nothing comes from the runner's Ubuntu mirror. That mirror once
    # stalled for 30 minutes and once served 40 KB/s (runs 39950260395 and
    # 39957304950). Its version matches the playwright package installed below.
    # User 1001 is the runner's, who owns the workspace; Firefox refuses root.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      # Not setup-python: its toolcache Python is mounted from the host and its
      # scripts name the host's path, which does not exist in the container
      # (run 39962600116: `spawn /__t/Python/3.12.15/x64/bin/pip ENOENT`).
      # uv's Python is self-contained and installs as user 1001.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
      - name: Install package + dev deps
        run: uv pip install -e ".[dev]"
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Install the Playwright package (the image holds its browsers)
        working-directory: web
        run: npm install --no-save --package-lock=false playwright@1.63.0
      - name: Run the six browser checks
        env:
          WORKBENCH_BROWSER: ${{ matrix.browser }}
        # The same World fixture as the server job starts Workbench and fake
        # Eugene on random loopback ports, seeds each chat and runs its script.
        # Nothing here starts an agent or uses the live install's ports.
        # In a container job `github.workspace` is the host's path; the
        # variable is the container's.
        run: |
          for variable in ${!EUGENE_PLEXUS_@}; do unset "$variable"; done
          export WORKBENCH_PLAYWRIGHT="$GITHUB_WORKSPACE/web/node_modules/playwright"
          python -m pytest -q -s --basetemp=browser-results \
            tests/test_reading_browser.py \
            tests/test_rich_math_browser.py \
            tests/test_rich_diagram_browser.py \
            tests/test_rich_artifacts_browser.py \
            tests/test_rich_artifacts_inline_browser.py \
            tests/test_rich_structured_browser.py
      - name: Keep browser pictures and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browsers-${{ matrix.browser }}
          # Configs alongside the shots contain session cookies: keep only shots.
          path: browser-results/**/shots/**
          if-no-files-found: ignore

  long-chats:
    # Row 26: a real Workbench, gateway and inference driver over a recording stand-in engine
    # that refuses a prompt past its window with llama-server's own body (about four minutes).
    # Every port is the OS's, never 8079-8083, and every EUGENE_PLEXUS_* variable is dropped.
    name: Long chats acceptance (row 26)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          path: workbench
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/gateway
          ref: main
          path: gateway
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/inference-driver
          ref: main
          path: inference-driver
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Workbench, the gateway and the driver, each in its own environment
        # The driver imports httpx at run time but declares it only for development
        # (inference-driver#11), so it is named here.
        run: |
          python -m venv workbench/.venv && workbench/.venv/bin/pip install -q -e "./workbench[dev]"
          python -m venv gateway/.venv && gateway/.venv/bin/pip install -q -e ./gateway
          python -m venv inference-driver/.venv
          inference-driver/.venv/bin/pip install -q -e ./inference-driver "httpx>=0.27,<1"
      - name: Long chats acceptance
        env:
          EP_ROOT: ${{ github.workspace }}
        run: |
          for variable in ${!EUGENE_PLEXUS_@}; do unset "$variable"; done
          workbench/.venv/bin/python workbench/scripts/row26-long-chats-acceptance.py

  codegen-freshness:
    name: Codegen freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Regenerate models from pinned specs
        run: python scripts/codegen.py
      - name: Assert no diff
        shell: bash
        run: |
          if ! git diff --exit-code src/eugene_plexus_workbench/_generated/ src/eugene_plexus_workbench/a2ui_schema/ src/eugene_plexus_workbench/agui_schema/; then
            echo "::error::Generated models are out of sync with SPECS_REF."
            exit 1
          fi

  dco:
    name: DCO sign-off check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check Signed-off-by lines on every PR commit
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r sha; do
            [[ -z "$sha" ]] && continue
            name=$(git log -1 --format=%an "$sha")
            email=$(git log -1 --format=%ae "$sha")
            if ! git log -1 --format=%B "$sha" | grep -Fxq "Signed-off-by: ${name} <${email}>"; then
              echo "::error::Commit $sha is missing a matching DCO sign-off."
              status=1
            fi
          done < <(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}")
          exit $status
